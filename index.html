<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="国際政治と国際政治経済のニュースを、続いているストーリーにまとめる朝のダイジェスト。広い画面では三つの窓、iPhoneでは下のタブ。">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="News Digest">
<title>News Digest</title>
<style>
/* Layout idea: one app in two shapes. Wide: sidebar | story list | story detail, like a mail app.
   Narrow: bottom tabs and full-screen pages, like a phone app. Colour is kept quiet. Surfaces and text are a cool
   grey with a slight blue bias, the accent (indigo) marks only the place you are, what you follow and the map,
   and one muted ochre marks the key flag. Three palettes can be tried in Settings during the mockup. */
:root {
  --ground: #eceff3;   /* sidebar and app frame */
  --surface: #fbfbfd;  /* reading surface */
  --ink: #1a2130;
  --muted: #5b6578;
  --line: #dde1e8;
  --accent: #3a4f8a;   /* indigo: the place you are, links, the followed state, the map */
  --mark: #8c6420;     /* ochre: the key flag and nothing else */
  --ff-en: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --ff-ja: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif;
  --ff-zh: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs-xs: 11.5px; --fs-s: 12.5px; --fs-m: 14px; --fs-l: 16px; --fs-xl: 24px; --fs-read: 15px; --fs-title: 14.5px;
  --pane: color-mix(in srgb, var(--surface) 55%, var(--ground));
  --well: color-mix(in srgb, var(--ink) 3.5%, var(--surface));      /* quiet panels */
  --track: color-mix(in srgb, var(--ink) 6%, var(--surface));       /* the bed of a segmented control */
  --accent-soft: color-mix(in srgb, var(--accent) 9%, var(--surface));
  --accent-ink: color-mix(in srgb, var(--accent) 86%, var(--ink));
  --on-accent: var(--surface);
  --hover: color-mix(in srgb, var(--ink) 5%, transparent);
  --lift: 0 1px 2px color-mix(in srgb, var(--ink) 14%, transparent);
  --sea: color-mix(in srgb, var(--accent) 5%, var(--surface));
  --land: color-mix(in srgb, var(--ink) 10%, var(--sea));
  --r1: 26%; --r2: 44%; --r3: 64%; --r4: 86%;                       /* map: how much accent in each step */
  --side-w: 240px; --list-w: clamp(330px, 29vw, 420px); --tab-h: 56px;
  color-scheme: light;
}
:root[data-palette="koke"] { --ground: #edf0ec; --surface: #fbfcfa; --ink: #1c231e; --muted: #5c675f; --line: #dce1db; --accent: #45695a; --mark: #9b5b3a; }
:root[data-palette="sumi"] { --ground: #efeeed; --surface: #fcfcfb; --ink: #1d1d1f; --muted: #62625f; --line: #e0dfdc; --accent: #2d3748; --mark: #a1472e; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0e1117; --surface: #151a22; --ink: #e4e8ef; --muted: #959fb1; --line: #262d38; --accent: #8ea4d8; --mark: #cfa65a;
    --r1: 31%; --r2: 43%; --r3: 57%; --r4: 75%; --land: color-mix(in srgb, var(--ink) 13%, var(--sea));
    color-scheme: dark;
  }
  :root:not([data-theme="light"])[data-palette="koke"] { --ground: #0f1411; --surface: #161c18; --ink: #e4e9e4; --muted: #96a199; --line: #262f29; --accent: #86b09c; --mark: #d29a76; }
  :root:not([data-theme="light"])[data-palette="sumi"] { --ground: #111111; --surface: #181818; --ink: #e8e6e3; --muted: #9c9a96; --line: #2b2a28; --accent: #c9ccd3; --mark: #d9825f; }
}
:root[data-theme="dark"] {
  --ground: #0e1117; --surface: #151a22; --ink: #e4e8ef; --muted: #959fb1; --line: #262d38; --accent: #8ea4d8; --mark: #cfa65a;
  --r1: 31%; --r2: 43%; --r3: 57%; --r4: 75%; --land: color-mix(in srgb, var(--ink) 13%, var(--sea));
  color-scheme: dark;
}
:root[data-theme="dark"][data-palette="koke"] { --ground: #0f1411; --surface: #161c18; --ink: #e4e9e4; --muted: #96a199; --line: #262f29; --accent: #86b09c; --mark: #d29a76; }
:root[data-theme="dark"][data-palette="sumi"] { --ground: #111111; --surface: #181818; --ink: #e8e6e3; --muted: #9c9a96; --line: #2b2a28; --accent: #c9ccd3; --mark: #d9825f; }
@media (max-width: 859px) {
  :root { --fs-xs: 12.5px; --fs-s: 13.5px; --fs-m: 16px; --fs-l: 17px; --fs-xl: 26px; --fs-read: 17px; --fs-title: 17px; }
}

/* Each language picks its own type stack. Text that carries its own lang attribute (an English headline on a
   Japanese page) gets the right glyphs too. A new language needs one line here. */
:lang(en) { font-family: var(--ff-en); }
:lang(ja) { font-family: var(--ff-ja); line-break: strict; }
:lang(zh) { font-family: var(--ff-zh); }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--surface); color: var(--ink); font-size: var(--fs-m); line-height: 1.65; font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
svg { flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* shell. On a wide screen the three panes fill the window and the window itself never scrolls (each pane scrolls inside).
   The box is fixed to the window, not given a height in viewport units, for two reasons. A fixed box is measured against the
   window again at every zoom step and resize. And it is the containing block of the absolutely placed texts inside it (the
   hidden "attention" labels of the list rows), so overflow: hidden clips them. Without that, they stuck out below the window,
   the page scrolled as a whole when zooming, and a blank strip showed under the panes (2026-11-16). */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); position: fixed; inset: 0; overflow: hidden; }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--surface); }
#view { flex: 1; min-height: 0; display: flex; flex-direction: column; outline: none; }
.tabbar, .navbar, .actionbar, .hero, .catchips, .bseg { display: none; }

/* sidebar */
.side { display: flex; flex-direction: column; gap: 22px; padding: 16px 10px 12px; overflow-y: auto; background: var(--ground); border-right: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 10px; }
.brand b { font-size: 15px; letter-spacing: .01em; display: block; line-height: 1.25; }
.brand small { display: block; font-size: var(--fs-xs); color: var(--muted); line-height: 1.3; }
.side h2 { font-size: var(--fs-xs); font-weight: 600; color: var(--muted); padding: 0 10px 5px; letter-spacing: .05em; }
.ni, .ci, .fi { display: flex; align-items: center; gap: 10px; padding: 5px 10px; border-radius: 6px; text-decoration: none; font-size: 13.5px; min-height: 30px; }
.ni:hover, .ci:hover, .fi:hover { background: var(--hover); }
.side [aria-current] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.nl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nc { font-size: var(--fs-xs); color: var(--muted); font-weight: 400; }
.nstage { font: 10.5px/1 var(--font-mono); color: var(--muted); border: 1px dashed var(--muted); border-radius: 3px; padding: 2px 4px; }
.side-gap { flex: 1; }
.fi .nl { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.45; font-size: 13px; padding: 1px 0; }
.fnote { padding: 2px 10px; font-size: var(--fs-s); color: var(--muted); line-height: 1.55; }
.side-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 10px 0; border-top: 1px solid var(--line); font-size: var(--fs-xs); color: var(--muted); }
.side-foot > span { white-space: nowrap; }

/* shared bits */
.seg { display: inline-flex; border-radius: 8px; padding: 2px; background: var(--track); max-width: 100%; }
.seg button { border: 0; background: none; font-size: var(--fs-s); padding: 0 11px; height: 26px; border-radius: 6px; color: var(--muted); white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--lift); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 13px; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--hover); border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn[aria-pressed="true"] svg.fillable { fill: currentColor; }
.btn.icon { width: 32px; padding: 0; }
.btn:disabled { opacity: .4; cursor: default; }
.link { border: 0; background: none; padding: 0; color: var(--accent-ink); font-size: var(--fs-s); text-decoration: underline; text-underline-offset: 3px; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border: 1px solid var(--line); border-radius: 4px; font-size: var(--fs-xs); line-height: 1; text-decoration: none; white-space: nowrap; background: var(--surface); }
a.chip:hover { border-color: var(--accent); color: var(--accent-ink); }
.chip.dim { border-style: dashed; color: var(--muted); }
.sh { display: inline-block; width: 8px; height: 8px; flex: none; background: currentColor; }
.sh.official { background: none; border: 1.6px solid currentColor; }
.sh.news { border-radius: 50%; }
.sh.analysis { transform: rotate(45deg) scale(.82); }
.lab { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border: 1px solid var(--line); border-radius: 4px; font-size: var(--fs-xs); white-space: nowrap; }
.lang { font: 10.5px/1 var(--font-mono); padding: 2px 4px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); }
.key { display: inline-flex; align-items: center; gap: 4px; color: var(--mark); vertical-align: -2px; margin-right: 5px; }
.key svg { width: 14px; height: 14px; }
.key .kt { font-size: var(--fs-s); font-weight: 600; }
.none { color: var(--muted); }
.mono { font-family: var(--font-mono); }
kbd { font: 11.5px var(--font-mono); padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--surface); }

/* list pane */
.split { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--list-w) minmax(0, 1fr); }
.listpane { background: var(--pane); border-right: 1px solid var(--line); overflow-y: auto; min-width: 0; }
.detailpane { overflow-y: auto; min-width: 0; background: var(--surface); }
.lh { position: sticky; top: 0; z-index: 3; background: var(--pane); border-bottom: 1px solid var(--line); padding: 14px 16px 10px; display: grid; gap: 10px; }
.lh-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.lt { font-size: var(--fs-l); font-weight: 600; line-height: 1.3; display: block; }
.lt small { font-size: var(--fs-s); font-weight: 400; color: var(--muted); margin-left: 8px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.sbox { position: relative; flex: 1 1 100%; }
.sbox svg { position: absolute; left: 9px; top: 8px; color: var(--muted); pointer-events: none; z-index: 1; }
.sbox .lsearch, .sbox .inp { padding-left: 30px; width: 100%; }
.lh input, .lh select, .inp { height: 32px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 0 8px; font-size: 13px; min-width: 0; }
.lh select { flex: 1 1 0; }
.quiet { display: flex; gap: 12px; margin: 14px 16px 0; padding: 12px 14px; border: 1px dashed var(--muted); border-radius: 8px; font-size: 13px; line-height: 1.7; }
.quiet svg { margin-top: 3px; color: var(--accent-ink); }
.quiet p { color: var(--muted); }
.gh { position: sticky; top: 54px; z-index: 2; background: var(--pane); font-size: var(--fs-xs); font-weight: 600; color: var(--muted); letter-spacing: .05em; padding: 12px 16px 4px; }
.row { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 15px 18px 15px 12px; border-bottom: 1px solid var(--line); text-decoration: none; }
.row:hover { background: var(--hover); }
.row[aria-current] { background: var(--accent-soft); }
.row:focus-visible { outline-offset: -2px; }
.rk { font: var(--fs-xs)/1.9 var(--font-mono); color: var(--muted); text-align: right; }
.rt { font-size: var(--fs-title); font-weight: 600; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rs { font-size: var(--fs-s); line-height: 1.6; color: var(--muted); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rm { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 12px; margin-top: 7px; font-size: var(--fs-xs); color: var(--muted); }
.rm .cs { flex: 1 1 100%; color: color-mix(in srgb, var(--ink) 72%, var(--muted)); font-size: var(--fs-s); line-height: 1.5; }
.lc { display: inline-flex; align-items: center; gap: 4px; }
.rows .end { padding: 14px 16px 30px; font-size: var(--fs-s); color: var(--muted); }
.noresult { padding: 28px 16px; color: var(--muted); font-size: 13px; }
.crow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 10px; padding: 8px 16px; border-bottom: 1px solid var(--line); text-decoration: none; }
.crow:hover { background: var(--hover); }
.crow[aria-current] { background: var(--accent-soft); font-weight: 600; color: var(--accent-ink); }
.crow .cc { font: var(--fs-xs) var(--font-mono); color: var(--muted); margin-left: 8px; font-weight: 400; }
.crow .cn { font-size: var(--fs-s); color: var(--muted); font-weight: 400; }
.cbar { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--ink) 8%, transparent); }
.cbar i { display: block; height: 100%; width: var(--w); border-radius: 2px; background: color-mix(in srgb, var(--accent) 70%, var(--surface)); }

/* detail pane */
.dtool { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.dtool .pos { font: var(--fs-xs) var(--font-mono); color: var(--muted); margin: 0 6px 0 2px; }
.dtool .sp { flex: 1; }
.detail { max-width: 760px; margin: 0 auto; padding: 28px 40px 80px; }
.kick { font-size: var(--fs-s); color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; }
.kick b { font-weight: 600; color: var(--ink); }
.kick .key { margin: 0; }
.detail h1 { font-size: var(--fs-xl); line-height: 1.45; font-weight: 600; margin: 10px 0 8px; letter-spacing: .01em; }
.lede { color: var(--muted); font-size: var(--fs-read); line-height: 1.8; }
.facts { display: grid; grid-template-columns: 6em minmax(0, 1fr); gap: 14px 16px; margin: 24px 0 0; padding: 18px 22px; background: var(--well); border-radius: 12px; }
.facts dt { font-size: var(--fs-s); font-weight: 600; color: var(--muted); padding-top: 3px; }
.facts dd.st { font-size: var(--fs-l); font-weight: 600; line-height: 1.75; }
.sec { font-size: var(--fs-s); font-weight: 600; color: var(--muted); letter-spacing: .06em; margin: 40px 0 14px; display: flex; align-items: baseline; gap: 8px; }
.sec span { font-weight: 400; font-family: var(--font-mono); font-size: var(--fs-xs); }
.summary { font-size: var(--fs-read); line-height: 2; max-width: 40em; }
.summary p + p { margin-top: .7em; }
.points li { position: relative; padding-left: 18px; }
.points li + li { margin-top: .6em; }
.points li::before { content: ""; position: absolute; left: 1px; top: .9em; width: 7px; height: 2px; background: var(--muted); }
.tl li { position: relative; padding: 0 0 18px 24px; }
.tl li::before { content: ""; position: absolute; left: 0; top: 7px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--accent); background: var(--surface); }
.tl li::after { content: ""; position: absolute; left: 4px; top: 20px; bottom: -2px; width: 1px; background: var(--line); }
.tl li:last-child::after { display: none; }
.tl .d { font: var(--fs-s) var(--font-mono); color: var(--muted); }
.tl p { line-height: 1.85; max-width: 40em; }
.tl .ev { font-size: var(--fs-xs); color: var(--muted); }
.gl { list-style: none; margin: 14px 0 0; padding: 0; }
.gl li { padding: 14px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.gl .gnm { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.gl .gnm b { font-size: var(--fs-m); }
.gl .ge { font: var(--fs-s) var(--font-mono); color: var(--muted); }
.gl .gt { margin: 6px 0 0; line-height: 1.8; max-width: 40em; }
.gl .gt.dim { color: var(--muted); }
.gok { color: var(--accent-ink); font-weight: 600; }
/* story suggestions (admins) */
.sgl { list-style: none; margin: 8px 0 0; padding: 0; }
.sgl li { padding: 10px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); line-height: 1.7; }
.sgl .sm { font-size: var(--fs-xs); color: var(--muted); margin-top: 2px; }
.sgl .sgdone { margin: 0; }
.sgl .sgact { margin-top: 6px; }
.sgl .sgwhat { margin: 0; font-size: var(--fs-s); color: var(--muted); line-height: 1.7; max-width: 40em; }
.sgl .gra { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.sgl .sgpend { margin: 0; font-size: var(--fs-s); color: var(--accent-ink); font-weight: 600; }
.sgl .sgfail { margin: 8px 0 0; font-size: var(--fs-s); color: color-mix(in srgb, #b3261e 82%, var(--ink)); }
/* weekly review */
.wkspan { font-size: var(--fs-l); font-weight: 600; margin: 14px 0 0; }
.wkbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 10px 0 4px; }
.wkbar .dn { margin-right: 2px; }
.wkbar a.lab { text-decoration: none; color: var(--muted); }
.wkbar a.lab[aria-current] { color: var(--accent-ink); border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.wkl { list-style: none; margin: 4px 0 0; padding: 0; font-size: var(--fs-s); color: var(--muted); }
.wkl li { margin-top: 2px; line-height: 1.6; }
.wkl .wd { font: var(--fs-xs) var(--font-mono); margin-right: 4px; }
.wkn { list-style: none; margin: 10px 0 0; padding: 0; }
.wkn li { padding: 6px 0; line-height: 1.7; }
/* glossary review (admins) */
.lab.pend { border-color: var(--accent); color: var(--accent-ink); }
.grl .gra, .grform .gra { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.grform { display: grid; gap: 10px; margin-top: 10px; max-width: 40em; }
.grform label { display: grid; gap: 4px; font-size: var(--fs-s); color: var(--muted); }
.grbody .seg { margin-top: 14px; }
.inp.grta { height: auto; width: 100%; padding: 8px 10px; line-height: 1.7; resize: vertical; font-size: var(--fs-m); color: var(--ink); }
.gl li[aria-current="true"] { background: color-mix(in srgb, var(--accent) 10%, transparent); box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 4px; }
/* A glossary term in a text: a dotted underline. A card with the definition opens on hover, focus or tap. */
.gterm { text-decoration: underline dotted; text-decoration-thickness: 1.5px; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--accent) 75%, transparent); cursor: help; border-radius: 3px; }
.gterm:hover, .gterm[aria-describedby] { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.gterm:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.chip.gterm { text-decoration: none; }
#gpop { position: fixed; z-index: 80; width: min(340px, calc(100vw - 16px)); padding: 12px 14px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--lift); font-size: var(--fs-s); line-height: 1.7; }
#gpop[hidden] { display: none; }
#gpop .gpn { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
#gpop .gpn b { font-size: var(--fs-m); }
#gpop .gpn .ge { font: var(--fs-s) var(--font-mono); color: var(--muted); }

/* Items left alone: the closed block under the Today list, and the day groups in the Library. */

/* home pane (wide Today with no story open): the daily summary, in full */
.home { max-width: 660px; margin: 0 auto; padding: 60px 40px 80px; }
.dateblock { display: flex; align-items: center; gap: 16px; }

/* pages (library, placeholders) */
.page { flex: 1; overflow-y: auto; min-height: 0; }
.pagein { max-width: 780px; margin: 0 auto; padding: 32px 40px 80px; }
.ph1 { font-size: var(--fs-xl); font-weight: 600; line-height: 1.4; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pl { color: var(--muted); margin-top: 6px; max-width: 38em; line-height: 1.85; }
.tabs { display: flex; gap: 2px; margin: 22px 0 0; border-bottom: 1px solid var(--line); overflow-x: auto; }

.tabs a[aria-current] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }

.bare { border-top: 1px solid var(--line); }

.stage { display: inline-block; font-size: var(--fs-xs); font-weight: 600; padding: 2px 8px; border: 1px dashed var(--accent); border-radius: 4px; color: var(--accent-ink); vertical-align: 2px; }
.phgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 36px; margin-top: 30px; }
.phgrid h2 { font-size: var(--fs-s); font-weight: 600; color: var(--muted); letter-spacing: .06em; margin-bottom: 8px; }
.phgrid li { padding: 8px 0 8px 18px; border-bottom: 1px solid var(--line); position: relative; line-height: 1.7; }
.phgrid li::before { content: ""; position: absolute; left: 2px; top: 17px; width: 7px; height: 7px; border: 1.5px solid var(--muted); border-radius: 2px; }
.ghost { margin-top: 34px; padding: 18px; border: 1px dashed var(--line); border-radius: 8px; display: grid; gap: 12px; }
.ghost .gr { display: flex; gap: 14px; align-items: center; }
.ghost i { display: block; height: 10px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 9%, transparent); }
.ghost .bx { width: 46px; height: 46px; flex: none; border-radius: 6px; background: color-mix(in srgb, var(--ink) 7%, transparent); }
.ghost .gcol { flex: 1; display: grid; gap: 8px; }

.cs-head { padding: 22px 28px 14px; border-bottom: 1px solid var(--line); }

.cs-head p { color: var(--muted); font-size: 13px; }
.cstories { max-width: 760px; }

/* settings */
.settings { flex: 1; min-height: 0; display: grid; grid-template-columns: 224px minmax(0, 1fr); }

.snav a[aria-current] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.sbody { overflow-y: auto; min-width: 0; }
.sin { max-width: 720px; padding: 30px 40px 80px; margin: 0 auto 0 0; }

.sw { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 0; font-size: var(--fs-s); color: var(--muted); min-height: 24px; }

.tablewrap { overflow-x: auto; margin-top: 14px; border: 1px solid var(--line); border-radius: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }

/* world map */
.mapcard { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin-top: 4px; }
.maphead { display: flex; min-width: 0; overflow-x: auto; scrollbar-width: none; }

.mapbox.mini { margin: 0 0 12px; max-height: 280px; }
.map { width: 100%; height: 100%; display: block; }
.map .land { fill: var(--land); stroke: var(--sea); stroke-width: .6px; vector-effect: non-scaling-stroke; }
.land.lv1, .dot.lv1 { fill: color-mix(in srgb, var(--accent) var(--r1), var(--sea)); background: color-mix(in srgb, var(--accent) var(--r1), var(--sea)); }

.land.lv3, .dot.lv3 { fill: color-mix(in srgb, var(--accent) var(--r3), var(--sea)); background: color-mix(in srgb, var(--accent) var(--r3), var(--sea)); }

.dothit { fill: transparent; stroke: none; }
.dothit:hover, .dothit:focus-visible { stroke: var(--ink); stroke-width: 1.2px; vector-effect: non-scaling-stroke; }
.sel { fill: none; stroke: var(--ink); stroke-width: 1.6px; vector-effect: non-scaling-stroke; pointer-events: none; }
.mlabel { fill: var(--ink); font-weight: 500; letter-spacing: .03em; paint-order: stroke; stroke: var(--sea); stroke-width: 2.4px; stroke-linejoin: round; vector-effect: non-scaling-stroke; pointer-events: none; }

.pin { fill: var(--surface); stroke: var(--ink); stroke-width: 1.8px; vector-effect: non-scaling-stroke; pointer-events: none; }

.pagein section + section { margin-top: 4px; }

/* look back (a designed place) and the ask panel */
.slot { display: grid; gap: 12px; max-width: 40em; padding: 14px 16px; border: 1px dashed var(--line); border-radius: 8px; }
.slotrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }

.askpanel textarea { width: 100%; min-height: 76px; resize: vertical; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: var(--fs-m); line-height: 1.6; }
.arow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

  } }, W.forgot);
  card('form', { novalidate: true, onsubmit: async ev => {
    ev.preventDefault();
    go.disabled = true; say(W.loading);
    try { await signInWithEmailAndPassword(auth, email.value.trim(), pin.value); }
    catch (e) { say(authMessage(e), true); go.disabled = false; pin.value = ''; pin.focus(); }
  } },
  el('p', {}, W.lead),
  el('label', { for: 'lg-email' }, W.email, email),
  el('label', { for: 'lg-pin' }, W.pin, pin),
  msg, go, forgot);
  email.focus();
}
const showLoading = () => card('div', {}, el('p', { role: 'status' }, W.loading));
function showMessage(text, ...buttons) { card('div', {}, el('p', { role: 'alert' }, text), ...buttons); }
const outButton = () => el('button', { class: 'btn', type: 'button', onclick: () => fbSignOut(auth) }, W.signOut);

let started = false, entering = false;
async function enter(user) {
  if (started || entering) return;
  entering = true;
  showLoading();
  try {
    const meSnap = await getDoc(doc(db, 'users', user.uid));
    if (!meSnap.exists()) return showMessage(W.notRegistered, outButton());
    const me = meSnap.data();
    if (me.active !== true) return showMessage(W.stopped, outButton());
    const admin = me.role === 'admin';
    const [appSnap, costsSnap, hiddenSnap, suggestSnap, mapRes, prefsSnap, settingsSnap] = await Promise.all([
      getDocs(collection(db, 'app')),
      admin ? getDoc(doc(db, 'app_admin', 'costs')) : null,
      admin ? getDoc(doc(db, 'app_admin', 'glossary_hidden')) : null,      // the glossary entries an admin took out
      admin ? getDoc(doc(db, 'app_admin', 'story_suggestions')) : null,    // stories and items that may need a person (read only)
      fetch('world_map.json', { cache: 'no-cache' }),
      getDoc(doc(db, 'users', user.uid, 'settings', 'prefs')),
      getDoc(doc(db, 'settings', 'app')),
    ]);
    const parts = {};
    appSnap.forEach(d => { parts[d.id] = JSON.parse(d.data().json); });
    if (!parts.core) return showMessage(W.noData, outButton());
    const adminParts = {};
    if (admin && costsSnap && costsSnap.exists()) adminParts.costs = JSON.parse(costsSnap.data().json);
    if (admin) adminParts.glossary_hidden = hiddenSnap && hiddenSnap.exists() ? JSON.parse(hiddenSnap.data().json) : [];
    if (admin) adminParts.story_suggestions = suggestSnap && suggestSnap.exists() ? JSON.parse(suggestSnap.data().json) : null;
    const data = assemble(parts, adminParts, mapRes.ok ? { map: await mapRes.json() } : {});
    applyPrefs(prefsSnap.exists() ? prefsSnap.data() : {});
    const shared = settingsSnap.exists() ? settingsSnap.data() : {};
    start(data, user, me, { digest_time: shared.digest_time || data.settings.digest_time, timezone: shared.timezone || data.settings.timezone });
  } catch (e) {
    showMessage(W.loadFail, el('button', { class: 'btn primary', type: 'button', onclick: () => { entering = false; enter(user); } }, W.retry), outButton());
  } finally {
    entering = false;
  }
}

function start(data, user, me, shared) {
  const uid = user.uid;
  const prefsRef = doc(db, 'users', uid, 'settings', 'prefs');
  const pending = {};
  let timer = null;
  async function flush() {
    clearTimeout(timer);
    if (!Object.keys(pending).length) return;
    const batch = Object.assign({}, pending);
    for (const k of Object.keys(pending)) delete pending[k];
    try { await setDoc(prefsRef, Object.assign(batch, { updated_at: new Date().toISOString() }), { merge: true }); }
    catch (e) { for (const k of Object.keys(batch)) if (!(k in pending)) pending[k] = batch[k]; }      // try again with the next change
  }
  const USER = {
    uid, role: me.role, display_name: me.display_name, app: shared,
    sync(key, value) {
      const field = Object.keys(FIELDS).find(f => FIELDS[f] === key);
      if (!field) return;
      pending[field] = value;
      clearTimeout(timer);
      timer = setTimeout(flush, 800);
    },
    api: {
      setDisplayName: name => updateDoc(doc(db, 'users', uid), { display_name: name }),
      async changePin(current, next) {
        try { await reauthenticateWithCredential(user, EmailAuthProvider.credential(user.email, current)); }
        catch (e) { throw Object.assign(new Error('wrong PIN'), { code: 'wrong-pin' }); }
        try { await updatePassword(user, next); }
        catch (e) { throw Object.assign(new Error('not changed'), { code: e && e.code === 'auth/requires-recent-login' ? 'recent' : 'failed' }); }
      },
      async signOut() { await flush(); await fbSignOut(auth); clearLocal(); location.reload(); },
      saveAppSettings: ({ digest_time, timezone }) => setDoc(doc(db, 'settings', 'app'), { digest_time, timezone, updated_at: new Date().toISOString() }),
      async listUsers() {
        const snap = await getDocs(collection(db, 'users'));
        return snap.docs.map(d => Object.assign({ uid: d.id }, d.data())).sort((a, b) => String(a.created_at || '').localeCompare(String(b.created_at || '')));
      },
      setActive: (otherUid, active) => updateDoc(doc(db, 'users', otherUid), { active }),
      // What an admin decided about glossary entries: one plain document per entry (status, optional texts, time). The scripts
      // read these at their next run and publish the result. The rules accept only this shape and only from an admin.
      async listGlossaryReview() {
        const snap = await getDocs(collection(db, 'glossary_review'));
        const out = {};
        snap.forEach(d => { out[d.id] = d.data(); });
        return out;
      },
      saveGlossaryReview: (entryId, fields) => setDoc(doc(db, 'glossary_review', entryId), Object.assign({}, fields, { at: new Date().toISOString() })),
      // What an admin decided about a story suggestion (docs/story-review-design.md): one plain document per suggestion, story_review/{key}.
      // decision is approve, reject or reset. n (the number of articles then) is sent only for a large story that is left as it is.
      // The scripts read these at the start of their next run. The rules accept only this shape and only from an admin.
      async listStoryReview() {
        const snap = await getDocs(collection(db, 'story_review'));
        const out = {};
        snap.forEach(d => { out[d.id] = d.data(); });
        return out;
      },
      async saveStoryReview(key, decision, n) {
        const fields = { decision, at: new Date().toISOString() };
        if (typeof n === 'number') fields.n = n;
        await setDoc(doc(db, 'story_review', key), fields);      // replaces the document, no merge
        return fields;      // what was written: the screen shows "sent" from it at once
      },
    },
  };
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { hiddenAt = Date.now(); flush(); }
    else if (hiddenAt && Date.now() - hiddenAt > 30 * 60 * 1000) location.reload();      // the data is fresh once a day
  });
  addEventListener('pagehide', flush);
  started = true;
  root.hidden = true;
  const hide = document.getElementById('boot-hide');
  if (hide) hide.remove();
  
  window.startApp(data, USER);
}


showLoading();
onAuthStateChanged(auth, user => { if (user) enter(user); else if (!started) showLogin(); });
</script>
